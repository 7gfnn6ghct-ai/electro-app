<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТОО «ЭлектроБезопасность» — АСУ МКД</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Шапка системы -->
  <header class="top-bar">
    <div class="brand-box">
      <button id="sidebarToggle" class="mobile-toggle-btn">☰</button>
      <div class="brand-logo">ЭБ</div>
      <div class="brand-info">
        <strong>ТОО «ЭлектроБезопасность»</strong>
        <small>г. Рудный • АСУ Жилым Фондом</small>
      </div>
    </div>

    <!-- Переключатель тестового режима -->
    <div class="test-panel">
      <label for="roleSelector">🎭 Тестовый режим:</label>
      <select id="roleSelector" class="role-select">
        <option value="director">👑 Директор</option>
        <option value="dispatcher">🎧 Диспетчер</option>
        <option value="worker">🛠 Мастер / Работник</option>
        <option value="tenant">🏠 Жилец (Качарская, 53)</option>
      </select>
    </div>
  </header>

  <!-- Основной макет -->
  <div class="main-wrapper">
    <!-- Боковое меню (только для персонала) -->
    <aside id="sidebar" class="sidebar">
      <nav class="nav-menu">
        <button class="nav-btn active" data-page="houses">
          <span>🏢</span> Объекты (18 МКД)
        </button>
        <button class="nav-btn" data-page="tickets">
          <span>📋</span> Журнал заявок
        </button>
        <button class="nav-btn" data-page="accidents">
          <span>⚠️</span> Аварии и отключения
        </button>
        <button class="nav-btn" data-page="workers">
          <span>👷‍♂️</span> Персонал и смены
        </button>
        <button class="nav-btn" data-page="settings">
          <span>⚙️</span> Настройки системы
        </button>
      </nav>
      <div class="sidebar-footer">
        <small>ТОО «ЭлектроБезопасность»<br>г. Рудный • 2026</small>
      </div>
    </aside>

    <!-- Основная рабочая область -->
    <main id="contentApp" class="content-viewport">
      <!-- Динамический контент из app.js -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
